# 자동 검사(CI) — 깃허브에 코드를 올리거나(Pull Request 포함) 할 때마다 타입 검사와 테스트를 돌립니다.
# 하나라도 실패하면 깃허브 화면에 빨간 X가 떠서, 깨진 코드가 배포되기 전에 알 수 있습니다.
# 비밀값(키)은 쓰지 않습니다 — 테스트는 외부 서비스에 접속하지 않는 순수 로직만 검사합니다.
#
# ⚠ 코드 스타일 검사(npm run lint)는 기존 코드에 쌓인 경고·오류가 많아 아직 넣지 않았습니다.
#    정리한 뒤 아래에 "- run: npm run lint" 한 줄을 추가하면 됩니다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test
